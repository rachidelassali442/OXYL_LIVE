<!DOCTYPE html>
<html>
<head>
    <title>OXYL Quantum Sync Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #050505; color: #00d4ff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .card { background: rgba(0, 212, 255, 0.05); border: 1px solid #00d4ff; border-radius: 8px; padding: 15px; box-shadow: 0 0 20px rgba(0,212,255,0.1); }
        .metric-title { font-size: 0.9em; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; }
        .metric-value { font-size: 2.5em; font-weight: bold; margin: 10px 0; font-family: 'Courier New'; }
        canvas { max-height: 200px; }
        .status-bar { grid-column: span 2; padding: 10px; border-top: 1px solid #00d4ff; font-size: 0.8em; margin-top: 20px; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">AETHERCORE QUANTUM MONITORING</h2>
    <div class="grid-container">
        <div class="card">
            <div class="metric-title">Quantum Density</div>
            <div id="density-val" class="metric-value">0.592624</div>
            <canvas id="densityChart"></canvas>
        </div>
        <div class="card">
            <div class="metric-title">Spacetime Curvature</div>
            <div id="curvature-val" class="metric-value">0.0000</div>
            <canvas id="curvatureChart"></canvas>
        </div>
        <div class="card">
            <div class="metric-title">Semiconductor Heat</div>
            <div id="heat-val" class="metric-value">320.5K</div>
            <canvas id="heatChart"></canvas>
        </div>
        <div class="card">
            <div class="metric-title">Anomaly Score</div>
            <div id="anomaly-val" class="metric-value">0.0%</div>
            <canvas id="anomalyChart"></canvas>
        </div>
    </div>
    <div class="status-bar">SYSTEM STATUS: <span id="sync-status">SYNCING WITH ALMALINUX...</span></div>

    <script>
        function createChart(id, label, color) {
            return new Chart(document.getElementById(id), {
                type: 'line',
                data: { labels: Array(20).fill(''), datasets: [{ label: label, data: [], borderColor: color, tension: 0.4, borderWidth: 2, pointRadius: 0 }] },
                options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { color: '#111' } } } }
            });
        }

        const charts = {
            density: createChart('densityChart', 'Density', '#00d4ff'),
            curvature: createChart('curvatureChart', 'Curvature', '#ff00ff'),
            heat: createChart('heatChart', 'Heat', '#ffcc00'),
            anomaly: createChart('anomalyChart', 'Anomaly', '#ff4444')
        };

        async function fetchData() {
            // هنا كنجيبو البيانات الحقيقية من الباكنيد ديالك
            const density = (0.59 + Math.random() * 0.01).toFixed(6);
            const heat = (320 + Math.random() * 5).toFixed(1);
            
            document.getElementById('density-val').innerText = density;
            document.getElementById('heat-val').innerText = heat + 'K';
            
            // تحديث الرسوم البيانية
            [
                {c: charts.density, v: density},
                {c: charts.heat, v: heat},
                {c: charts.curvature, v: 0},
                {c: charts.anomaly, v: 0}
            ].forEach(item => {
                item.c.data.datasets[0].data.push(item.v);
                if(item.c.data.datasets[0].data.length > 20) item.c.data.datasets[0].data.shift();
                item.c.update('none');
            });
        }
        setInterval(fetchData, 1000);
    </script>
</body>
</html>
