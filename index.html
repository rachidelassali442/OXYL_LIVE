<!DOCTYPE html>
<html lang="en">
<head>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PQK477CKHP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());
      gtag("config", "G-PQK477CKHP");
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXYL | Quantum Sync Engine</title>
    <style>
        :root { --neon: #00FFCC; --glass: rgba(255, 255, 255, 0.05); }
        body { background: #050505; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; }
        .dashboard { position: absolute; z-index: 2; padding: 40px; width: 100%; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at 50% 50%, rgba(0, 255, 204, 0.05) 0%, transparent 70%); }
        .glass-card { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 25px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 600px; }
        .stat-value { color: var(--neon); font-size: 2em; font-weight: bold; text-shadow: 0 0 10px var(--neon); }
        canvas { position: fixed; top: 0; left: 0; z-index: 1; }
        .header { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <canvas id="quantumCanvas"></canvas>
    
    <div class="dashboard">
        <div class="header">
            <div>
                <h1 style="margin:0; letter-spacing: 5px;">OXYL.XYZ</h1>
                <p style="color: #666;">Quantum Neural Synchronizer v3.7.0</p>
            </div>
            <div class="glass-card">STATUS: <span id="status" style="color: var(--neon)">SYNCHRONIZING</span></div>
        </div>

        <div class="stats">
            <div class="glass-card">
                <div style="font-size: 0.8em; opacity: 0.6;">DENSITY</div>
                <div class="stat-value" id="density">0.000000</div>
            </div>
            <div class="glass-card">
                <div style="font-size: 0.8em; opacity: 0.6;">CURVATURE</div>
                <div class="stat-value" id="curvature">0.0000</div>
            </div>
            <div class="glass-card">
                <div style="font-size: 0.8em; opacity: 0.6;">HEAT</div>
                <div class="stat-value" id="heat">000.0 K</div>
            </div>
        </div>
    </div>

    <script>
        // 1. Quantum Oscilloscope Animation
        const canvas = document.getElementById('quantumCanvas');
        const ctx = canvas.getContext('2d');
        let time = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = resize;
        resize();

        function draw() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#00FFCC';
            ctx.lineWidth = 1.5;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00FFCC';

            ctx.beginPath();
            for (let x = 0; x < canvas.width; x++) {
                const wave1 = Math.sin(x * 0.005 + time) * 100;
                const wave2 = Math.sin(x * 0.01 - time * 2) * 30;
                const y = canvas.height / 2 + wave1 + wave2;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            time += 0.02;
            requestAnimationFrame(draw);
        }
        draw();

        // 2. Fetch Data from Backend
        async function updateStats() {
            try {
                // بدل هاد الـ IP بـ IP السيرفر ديالك
                const res = await fetch('http://YOUR_SERVER_IP:8000/api/v1/quantum-stats');
                const data = await res.json();
                document.getElementById('density').innerText = data.density;
                document.getElementById('curvature').innerText = data.curvature;
                document.getElementById('heat').innerText = data.heat + " K";
                document.getElementById('status').innerText = "STABLE";
            } catch (e) {
                document.getElementById('status').innerText = "OFFLINE";
                document.getElementById('status').style.color = "red";
            }
        }
        setInterval(updateStats, 2000);
    </script>
</body>
</html>
